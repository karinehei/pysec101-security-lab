name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Hae repository
        uses: actions/checkout@v4

      - name: Ota Python 3.12 käyttöön
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Asenna runtime- ja kehitysriippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tarkista tyyli Ruffilla
        run: ruff check solution tests

      - name: Suorita malliratkaisun testit
        run: pytest tests/test_solution.py -v

      # Banditia ei ajeta exercise-kansiolle, koska se sisältää
      # tarkoituksellisesti turvattoman koulutusesimerkin.
      - name: Suorita Bandit-tietoturvatarkistus
        run: bandit -r solution

      - name: Tarkista riippuvuudet pip-auditilla
        run: pip-audit -r requirements.txt
